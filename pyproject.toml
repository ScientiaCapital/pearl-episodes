[project]
name = "pearl-episodes"
version = "0.1.0"
description = "Record robot-learning demonstrations on Epiphan Pearl, run the stations through Epiphan Edge, and package each take as an episode in the formats labs use (LeRobot, RLDS)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["epiphan", "pearl", "epiphan-edge", "robot-learning", "open-x-embodiment", "lerobot", "rlds", "mcp"]
classifiers = [
    "Private :: Do Not Upload",
    "License :: OSI Approved :: Apache Software License",
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
authors = [{ name = "Tim Kipper", email = "tkipper@epiphan.com" }]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.15",
    "httpx>=0.28.1",
    # Export layouts. Ranges stay inside what lerobot 0.6.1 allows, so the optional datasets extra resolves.
    "numpy>=2.0,<2.3",
    "pandas>=2.0,<3",
    "pyarrow>=21",
    "pydantic>=2.10",
    "pydantic-settings>=2.15.0",
]

[project.optional-dependencies]
# Heavy, install on purpose: `uv sync --extra datasets`. lerobot 0.6.1 is verified: its own loader opens the
# export (tests/test_lerobot_loader.py). tensorflow stays unpinned until the RLDS exporter exists.
datasets = [
    "lerobot[dataset,av-dep]==0.6.1",
    "tensorflow",
    "tensorflow-datasets",
    "matplotlib",
    "jupyterlab",
]

[project.urls]
Source = "https://github.com/ScientiaCapital/pearl-episodes"
Issues = "https://github.com/ScientiaCapital/pearl-episodes/issues"

[project.scripts]
pearl-episodes = "pearl_episodes.cli:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["datasets: needs the optional datasets extra (lerobot); skipped when it is not installed"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".claude/hooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Tests may block: tmp_path checks and fixtures are not production I/O
"tests/*" = ["ASYNC"]
# SVG templates: long markup lines read better than wrapped f-strings
"scripts/build_readme_art.py" = ["E501"]
